name: Verify Android

on:
  pull_request:
  push:
    branches:
      - mymind-development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Run tests and build installable APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew testAndroidHostTest --rerun-tasks -q

      - name: Build release variant
        run: ./gradlew :androidApp:assembleRelease --no-daemon

      - name: Build installable debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MyMind-debug-installable
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
